version: "3"
services:
  node:
    container_name: server-side
    image: matheusfaggi/todolist_node
    working_dir: /app/
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=todolist
      - POSTGRES_PORT=5432 
    expose:
      - "3000"
    volumes: 
      - .:/app/
    ports:
      - 3000:3000
    links:
      - db
  db:
    image: matheusfaggi/todolist_db
    container_name: db
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=todolist
      - POSTGRES_PORT=5432
    volumes:
      - /var/lib/postgresql/data
    ports:
      - 5432:5432
  webpack:
    image: matheusfaggi/todolist_webpack
    container_name: client-side
    working_dir: /usr/src/app/
    volumes: 
      - ./src/app/views/:./usr/src/app/
    ports:
      - 8080:3001
    links:
      - node
    expose:
      - "3001"
    command:
    - webpack-init.sh